version: '3.8'

services:
  agent:
    build: .
    container_name: unifi-pco-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - CONNECTION_TOKEN=${CONNECTION_TOKEN:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./service-account.json:/app/service-account.json
      - ./.env:/app/.env
      - agent_dist:/app/dist
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-files: '3'

volumes:
  agent_dist:
