version: '3.8'

services:
  agent:
    build: .
    container_name: unifi-pco-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    env_file:
      - .env
    volumes:
      - ./service-account.json:/app/service-account.json
      - ./.env:/app/.env
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-files: '3'
